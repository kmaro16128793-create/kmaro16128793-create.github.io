name: Mina Brunch app quality gate

on:
  push:
    branches: [mina-app-absolute, mina-app-reprise-hardening]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked dependencies
        working-directory: app-src
        run: npm ci --no-audit --no-fund
      - name: Record resolved dependency versions
        working-directory: app-src
        run: npm list --depth=0
      - name: Typecheck and production build
        working-directory: app-src
        run: npm run build
      - name: Upload production preview
        uses: actions/upload-artifact@v4
        with:
          name: mina-app-dist
          path: app-src/dist
          if-no-files-found: error
