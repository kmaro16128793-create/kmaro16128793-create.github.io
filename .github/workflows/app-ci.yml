name: Mina Brunch app quality gate

on:
  push:
    branches: [mina-app-absolute, mina-app-reprise-hardening]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || '' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies reproducibly when lock exists
        working-directory: app-src
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
      - name: Record resolved dependency versions
        working-directory: app-src
        run: npm list --depth=0
      - name: Typecheck and production build
        working-directory: app-src
        run: npm run build
      - name: Commit generated lockfile on feature-branch push
        if: github.event_name == 'push'
        shell: bash
        run: |
          if git status --porcelain -- app-src/package-lock.json | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app-src/package-lock.json
            git commit -m "build(app): lock resolved dependencies"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: mina-app-package-lock
          path: app-src/package-lock.json
          if-no-files-found: error
      - name: Upload production preview
        uses: actions/upload-artifact@v4
        with:
          name: mina-app-dist
          path: app-src/dist
          if-no-files-found: error
